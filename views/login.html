<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Live Location Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --border-color: #2a364f;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1.25rem auto;
        }

        .input {
            background-color: var(--bg-main) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 8px !important;
            padding-left: 2.5rem !important;
            height: 2.75rem;
        }

        .input::placeholder {
            color: var(--text-muted);
        }

        .input:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 0.125em rgba(59, 130, 246, 0.25) !important;
        }

        .icon.is-left {
            color: var(--text-muted) !important;
            height: 2.75rem !important;
        }

        .btn-submit {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            height: 2.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--accent-blue-hover);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .login-footer {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <!-- Brand Icon -->
        <div class="brand-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1 class="title is-4 has-text-white mb-1">Welcome Back</h1>
        <p class="subtitle is-7 has-text-grey-light mb-5">Sign in to access Tracker Dashboard</p>

        <form action="/login" method="post">
            <!-- Username Field -->
            <div class="field mb-4">
                <div class="control has-icons-left">
                    <input type="text" class="input" placeholder="Username" required name="username" autocomplete="off">
                    <span class="icon is-small is-left">
                        <i class="fas fa-user"></i>
                    </span>
                </div>
            </div>

            <!-- Password Field -->
            <div class="field mb-5">
                <div class="control has-icons-left">
                    <input type="password" class="input" placeholder="Password" required name="password">
                    <span class="icon is-small is-left">
                        <i class="fas fa-lock"></i>
                    </span>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="button is-fullwidth btn-submit">
                <i class="fa-solid fa-right-to-bracket mr-2"></i> Login
            </button>
        </form>

        <div class="login-footer">
            <span>Live Location Tracking System</span>
        </div>
    </div>
</body>

</html>
