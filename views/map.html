<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map Tracking - Google Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-glass: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0f172a;
            color: var(--text-main);
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }

        /* Top Overlay Header */
        .map-overlay-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--accent-blue);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-updating .status-dot {
            background-color: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* Bottom Coordinates Panel */
        .coords-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            font-size: 0.85rem;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .coords-val {
            color: var(--accent-blue);
            font-family: monospace;
            font-weight: 600;
        }

        /* Custom Leaflet Marker Pulse */
        .leaflet-marker-icon {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }
    </style>
</head>

<body>
    <!-- Top Control Bar -->
    <div class="map-overlay-header">
        <a href="/" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
        <div class="status-badge" id="status-container">
            <span class="status-dot"></span>
            <span>Target: <strong id="display-id" style="color: var(--accent-blue);">--</strong></span>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Bottom Coords Display -->
    <div class="coords-panel">
        <span><i class="fa-solid fa-location-crosshairs mr-1"></i> Lat: <span id="lat-val" class="coords-val">0.00</span></span>
        <span>|</span>
        <span>Lng: <span id="lng-val" class="coords-val">0.00</span></span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const displayId = document.querySelector("#display-id")
        const statusContainer = document.querySelector("#status-container")
        const latVal = document.querySelector("#lat-val")
        const lngVal = document.querySelector("#lng-val")
        
        const id = new URLSearchParams(location.search).get("id")
        const latLng = JSON.parse(`{{ data }}`)

        // Initialize Map
        const map = L.map('map', {
            zoomControl: false // Move zoom control if needed
        }).setView(latLng, 15)

        // Add Zoom Control to Bottom Right
        L.control.zoom({ position: 'bottomright' }).addTo(map)

        // Google Maps Tiles Layer (Streets View)
        const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map)

        // Marker Setup
        const marker = L.marker(latLng).addTo(map)

        // Initial Values Set
        displayId.innerHTML = id
        updateCoords(latLng[0], latLng[1])

        function updateCoords(lat, lng) {
            latVal.innerHTML = parseFloat(lat).toFixed(5)
            lngVal.innerHTML = parseFloat(lng).toFixed(5)
        }

        // Realtime Socket Listener
        const socket = io("", {
            secure: true,
            path: "/socket.io",
            transports: ['websocket']
        })

        socket.on("map-data", data => {
            if (data.id == id) {
                // Updating Status UI
                statusContainer.classList.add("status-updating")
                
                const newPos = [data.lat, data.lng]
                marker.setLatLng(newPos)
                map.panTo(newPos, { animate: true, duration: 1.0 })
                updateCoords(data.lat, data.lng)

                setTimeout(() => {
                    statusContainer.classList.remove("status-updating")
                }, 2000)
            }
        })
    </script>
</body>

</html>
